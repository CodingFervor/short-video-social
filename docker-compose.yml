version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: video-postgres
    environment:
      POSTGRES_DB: video_social_db
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: video-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
